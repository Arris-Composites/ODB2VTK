name: Python Tests
on: [push, pull_request]

jobs:
  export-regressions:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Test Python exports without Abaqus
        run: python -m unittest discover -s python/tests -v

  vtk-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional reader validation dependencies
        run: python -m pip install numpy vtk
      - name: Verify complete exports with VTK
        run: python -m unittest discover -s python/tests -p test_vtk_reader.py -v
